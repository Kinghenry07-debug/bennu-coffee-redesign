        setCart(prev => {
          const existingIndex = prev.findIndex(i => i.id === item.id && JSON.stringify(i.options) === JSON.stringify(options));
          if (existingIndex > -1) {
            const updated = [...prev];
            updated[existingIndex].quantity += 1;
            return updated;
          }
          return [...prev, { ...item, quantity: 1, options, cartId: Date.now() }];
        });
        showToast(`Added ${item.name} to cart!`);
      };

                  <p className="text-stone-300 text-sm">Serving Austin since 2007</p>
                </div>
                <div className="bg-[#1a110c] p-8 rounded-3xl border border-white/10 text-stone-300 space-y-4 text-sm leading-relaxed">
                  <p>
                    Founded in 2007 by Steve and Stephanie Myers, Bennu Coffee was created with a clear mission: to give Austin a true 24-hour community coffee house where anyone—students, musicians, night-shift nurses, writers, and tech workers—could find sanctuary at any hour of the day or night.
                  </p>
                  <p>
                    Named after the ancient Egyptian bird of rebirth and creation, Bennu represents endless energy and local community spirit. Our signature gourmet mochas are each named after timeless literary classics, crafted with high-grade espresso and premium chocolate.
                  </p>
                </div>
              </section>
            )}

            {currentPage === 'catering' && (
              <section className="max-w-3xl mx-auto px-4 py-12 space-y-6">
                <h1 className="font-serif text-4xl font-bold text-center text-amber-50">Austin Coffee Catering</h1>
                <p className="text-center text-stone-300 text-sm">Bring Bennu signature mochas and local pastries to your office, wedding, or event.</p>
                <div className="bg-[#1a110c] p-6 rounded-3xl border border-white/10 space-y-4">
                  <input type="text" placeholder="Your Name" className="w-full p-3 rounded-xl bg-black/40 border border-white/10 text-xs text-white" />
                  <input type="email" placeholder="Email Address" className="w-full p-3 rounded-xl bg-black/40 border border-white/10 text-xs text-white" />
                  <textarea placeholder="Event Details & Date" className="w-full p-3 rounded-xl bg-black/40 border border-white/10 text-xs text-white h-28" />
                  <button onClick={() => showToast('Catering request sent!')} className="w-full py-3 rounded-xl bg-[#7FBBA8] text-[#120b08] font-bold text-xs uppercase tracking-wider">
                    Submit Catering Request
                  </button>
                </div>
              </section>
            )}

            {currentPage === 'merch' && (
              <section className="max-w-5xl mx-auto px-4 py-12 space-y-6">
                <h1 className="font-serif text-4xl font-bold text-center text-amber-50">Bennu Official Merch</h1>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {['Signature Bennu Mug', '24/7 Austin Hoodie', 'Whole Bean Coffee (12oz)'].map((name, i) => (
                    <div key={i} className="bg-[#1a110c] p-6 rounded-2xl border border-white/10 text-center space-y-3">
                      <div className="w-20 h-20 mx-auto rounded-full bg-[#7FBBA8]/20 flex items-center justify-center text-[#7FBBA8] font-bold text-2xl">
                        ☕
                      </div>
                      <h3 className="font-serif font-bold text-amber-100">{name}</h3>
                      <p className="text-[#7FBBA8] font-bold text-sm">$22.00</p>
                      <button onClick={() => showToast(`Added ${name} to cart!`)} className="w-full py-2 rounded-xl bg-white/10 text-xs font-bold hover:bg-white/20">
                        Add to Cart
                      </button>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-[#120b08] border-t border-white/10 py-12 px-4 text-xs text-stone-400">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <BennuLogo size="sm" />
              <div className="text-center md:text-left">
                <p>© 2026 Bennu Coffee Austin. Open 24/7/365.</p>
                <p className="text-stone-500 mt-1">2001 E MLK Jr Blvd • 515 S Congress Ave</p>
              </div>
              <button
                onClick={() => setIsSocialModalOpen(true)}
                className="px-4 py-2 rounded-full bg-white/10 text-amber-300 font-bold hover:bg-white/20"
              >
                📱 Social Media Handout
              </button>
            </div>
          </footer>

          {/* SOCIAL HANDOUT MODAL */}
          {isSocialModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#1a110c] border border-[#7FBBA8]/30 rounded-3xl p-6 max-w-lg w-full space-y-4">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-serif text-lg font-bold text-amber-100">Bennu Coffee Official Handout</h3>
                  <button onClick={() => setIsSocialModalOpen(false)} className="text-stone-400 font-bold">✕</button>
                </div>
                <div className="space-y-3 text-xs text-stone-300">
                  <p><strong>Instagram:</strong> @bennucoffee</p>
                  <p><strong>Facebook:</strong> Bennu Coffee East</p>
                  <p><strong>Twitter / X:</strong> @BennuCoffee</p>
                  <p><strong>Locations:</strong> 2001 E MLK Jr Blvd / 515 S Congress Ave</p>
                </div>
                <button
                  onClick={() => {
                    navigator.clipboard.writeText('Bennu Coffee Austin - 24/7 Craft Coffee & Signature Mochas. Instagram: @bennucoffee');
                    showToast('Copied handout text!');
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#7FBBA8] text-[#120b08] font-bold text-xs"
                >
                  Copy Handout Details
                </button>
              </div>
            </div>
          )}

          {/* DRINK CUSTOMIZER MODAL */}
          {customizerItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#1a110c] border border-white/10 rounded-3xl p-6 max-w-md w-full space-y-4">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-serif text-xl font-bold text-amber-100">{customizerItem.name}</h3>
                  <button onClick={() => setCustomizerItem(null)} className="text-stone-400 font-bold">✕</button>
                </div>
                <p className="text-xs text-stone-300">{customizerItem.description}</p>
                <div className="space-y-2 text-xs">
                  <p className="font-bold text-amber-300">Milk Option:</p>
                  <div className="flex gap-2">
                    {['Whole Milk', 'Oat Milk (+ $0.75)', 'Almond Milk (+ $0.75)', 'Soy Milk (+ $0.75)'].map((m, idx) => (
                      <span key={idx} className="px-2.5 py-1 bg-white/5 border border-white/10 rounded-lg cursor-pointer hover:bg-[#7FBBA8]/20">
                        {m}
                      </span>
                    ))}
                  </div>
                </div>
                <button
                  onClick={() => {
                    addToCart(customizerItem);
                    setCustomizerItem(null);
                  }}
                  className="w-full py-3 rounded-xl bg-[#7FBBA8] text-[#120b08] font-bold text-xs uppercase tracking-wider"
                >
                  Add to Order - ${customizerItem.price.toFixed(2)}
                </button>
              </div>
            </div>
          )}

          {/* MOCHA MATCH QUIZ MODAL */}
          {isQuizOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#1a110c] border border-[#7FBBA8]/30 rounded-3xl p-6 max-w-md w-full space-y-4 text-center">
                <h3 className="font-serif text-2xl font-bold text-amber-100">Mocha Match Quiz</h3>
                <p className="text-xs text-stone-300">Which flavor profile describes your current mood?</p>
                <div className="space-y-2">
                  {[
                    { text: 'Dark & Decadent Chocolate', match: MENU_ITEMS[0] },
                    { text: 'Sweet White Chocolate & Fruity Berry', match: MENU_ITEMS[1] },
                    { text: 'Warm Spicy Cinnamon & Cayenne', match: MENU_ITEMS[2] }
                  ].map((q, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setIsQuizOpen(false);
                        setCustomizerItem(q.match);
                      }}
                      className="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-xs text-amber-200 font-bold hover:bg-[#7FBBA8]/20 transition-all text-left"
                    >
                      {q.text}
                    </button>
                  ))}
                </div>
                <button onClick={() => setIsQuizOpen(false)} className="text-xs text-stone-400 underline">Close Quiz</button>
              </div>
            </div>
          )}

          {/* SHOPPING CART DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-md bg-[#120b08] border-l border-white/10 p-6 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center border-b border-white/10 pb-4 mb-4">
                    <h3 className="font-serif text-xl font-bold text-amber-100">Your 24/7 Order</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-stone-400 font-bold">✕</button>
                  </div>
                  {cart.length === 0 ? (
                    <p className="text-stone-400 text-xs text-center py-12">Your cart is currently empty.</p>
                  ) : (
                    <div className="space-y-3">
                      {cart.map((item, idx) => (
                        <div key={idx} className="flex justify-between items-center p-3 rounded-xl bg-[#1a110c] border border-white/5 text-xs">
                          <div>
                            <p className="font-bold text-white">{item.name}</p>
                            <p className="text-stone-400">Qty: {item.quantity}</p>
                          </div>
                          <p className="font-bold text-[#7FBBA8]">${(item.price * item.quantity).toFixed(2)}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {cart.length > 0 && (
                  <div className="space-y-3 pt-4 border-t border-white/10">
                    <div className="flex justify-between text-sm font-bold">
                      <span>Total:</span>
                      <span className="text-[#7FBBA8]">${subtotal.toFixed(2)}</span>
                    </div>
                    <button
                      onClick={() => {
                        setCart([]);
                        setIsCartOpen(false);
                        showToast('Order submitted! Thank you for ordering from Bennu Coffee.');
                      }}
                      className="w-full py-3.5 rounded-xl bg-[#7FBBA8] text-[#120b08] font-black text-xs uppercase tracking-wider"
                    >
                      Checkout Now
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#7FBBA8] text-[#120b08] font-bold text-xs px-5 py-3 rounded-2xl shadow-2xl animate-bounce">
              {toast}
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
